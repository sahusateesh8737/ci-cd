# 1. Name of the workflow
name: My First CI Pipeline

# 2. Trigger: Run this whenever code is pushed to the 'main' branch
on:
  push:
    branches: [ main ]

# 3. Jobs: A workflow is made of one or more "jobs" that can run in parallel
jobs:
  test-and-build:
    # Tell GitHub to start a fresh Ubuntu Virtual Machine
    runs-on: ubuntu-latest

    # 4. Steps: The actual list of tasks
    steps:
      # Step 1: Copy your code from GitHub onto the Ubuntu machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Node.js (so the machine knows how to run your app)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Step 3: Install your project dependencies (npm install)
      - name: Install Dependencies
        run: npm install

      # Step 4: Run your app.test.js file
      - name: Run Unit Tests
        run: npm test

      # Step 5: Build the Docker image (Only if tests pass!)
      - name: Build Docker Image
        run: docker build -t my-cicd-app .